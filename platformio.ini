; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Spot Micro Robot
data_dir = esp32/data
src_dir = esp32/src
include_dir = esp32/include
lib_dir = esp32/lib
test_dir = esp32/test
boards_dir = boards
extra_configs = 
	esp32/factory_settings.ini
	esp32/features.ini
	esp32/build_settings.ini
build_cache_dir = .pio/build_cache
; Windows cmd.exe caps command lines at 8191 chars. ESP-IDF 5.5 (esp32-s3-cam-n16r8)
; exceeds that when generating sections.ld because every -I points into the core dir.
; C:/pio is a directory junction to %USERPROFILE%/.platformio - same files, ~20 chars
; shorter per include path. Remove with: rmdir C:\pio
core_dir = C:/pio
default_envs = esp32-camera

; ================================================================
; Project environments
; More Board information: https://registry.platformio.org/platforms/platformio/espressif32/boards

[env:esp32-camera]
board = esp32cam
board_build.partitions = esp32/partition_table/huge_app.csv
monitor_rts = 0
monitor_dtr = 0
build_flags=
    ${env.build_flags}
	-D USE_CAMERA=1
	-D CAMERA_MODEL_AI_THINKER=1
	-D SDA_PIN=14
	-D SCL_PIN=15

[env:esp32-wroom-camera]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 8MB
upload_speed = 921600 
board_build.partitions = esp32/partition_table/default_8MB.csv
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-D USE_CAMERA=1
	-D CAMERA_MODEL_ESP32S3_EYE=1
	-D WS2812_PIN=48
	-D USS_LEFT_PIN=1
	-D USS_RIGHT_PIN=14
	-D SDA_PIN=47
	-D SCL_PIN=21

; ESP32-S3-CAM N16R8 (HW-679) — see docs/ESP32-S3-CAM-N16R8-Wi-Fi-Bluetooth.md
; Env name kept short: it appears 5x in the ldgen command line, which sits
; within ~130 chars of the Windows 8191-char cmd.exe limit on IDF 5.5.
; Flashed over UART0 with a CH343P adapter; no USB connector, no auto-reset.
[env:s3cam]
; IDF >= 5.4 is required so esp32-camera selects sccb-ng.c (new I2C driver).
; The default espressif32@6.8.1 ships IDF 5.3.0, whose legacy sccb.c conflicts
; with the project's driver_ng I2C bus and aborts in a global constructor.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = esp32/partition_table/default_16MB.csv
upload_speed = 460800
monitor_rts = 0
monitor_dtr = 0
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-D USE_CAMERA=1
	-D CAMERA_MODEL_ESP32S3_EYE=1
	-D SDA_PIN=47
	-D SCL_PIN=41
	-D WS2812_PIN=14

[env:seeed-xiao-esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
build_flags =
	${env.build_flags}
	-D USE_CAMERA=1
	-D CAMERA_MODEL_XIAO_ESP32S3=1
	-D SDA_PIN=5
	-D SCL_PIN=6

[env:esp32dev]
board = esp32dev
board_build.partitions = esp32/partition_table/min_spiffs.csv
build_flags =
    ${env.build_flags}

[env:esp32-p4]
platform = https://github.com/pioarduino/platform-espressif32.git
framework = espidf
board = esp32p4_dev
board_build.mcu = esp32p4
board_build.f_cpu = 360000000L
board_build.f_flash = 80000000L
board_build.f_psram = 200000000L
board_build.flash_mode = qio
board_upload.flash_size = 32MB
board_build.partitions = esp32/partition_table/default_32MB.csv
board_build.filesystem = littlefs
board_build.sdkconfig_defaults =
    esp32/sdkconfig.defaults
    esp32/sdkconfig.defaults.esp32p4
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    direct
    esp32_exception_decoder
extra_scripts =
    pre:esp32/scripts/pre_build.py
    pre:esp32/scripts/build_app.py
build_flags =
    ${env.build_flags}
    -D USE_CAMERA=1
    -D CAM_XCLK_PIN=-1
    -D CAM_RESET_PIN=-1
    -D CAM_PWDN_PIN=-1
    -D MIPI_CSI_HRES=800
    -D MIPI_CSI_VRES=640
    -D MIPI_CSI_LANE_BITRATE_MBPS=400
    -D MIPI_CSI_DATA_LANES=2
    -D CSI_JPEG_QUALITY=65
    -D BOARD_HAS_PSRAM
    -D SDA_PIN=7
    -D SCL_PIN=8
    -D WS2812_PIN=27


; ================================================================
; General environment section

[env]
platform = espressif32 @ 6.8.1
framework = espidf
monitor_speed = 115200
monitor_filters =
    direct
    esp32_exception_decoder
build_flags =
	${factory_settings.build_flags}
    ${features.build_flags}
	${build_settings.build_flags}
	-D CORE_DEBUG_LEVEL=4
	-D register=
	-std=gnu++2a
    -Ofast
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -I submodules/nanopb
    -Wno-missing-braces
    -Wno-format
    -D CONFIG_HTTPD_WS_SUPPORT=1
build_unflags = -std=gnu++11
build_src_flags = 
	-Wformat=2
	-Wformat-truncation
	-Wstack-usage=4096
	-Wno-format
test_ignore = test_embedded
board_build.filesystem = littlefs
board_build.embed_txtfiles =
board_build.sdkconfig_defaults = esp32/sdkconfig.defaults
lib_deps = 
lib_ldf_mode = deep
lib_compat_mode = strict
extra_scripts = 
	pre:esp32/scripts/pre_build.py
    pre:esp32/scripts/build_app.py
; debug_tool = esp-builtin
; debug_init_break = 
; upload_port = COM[13] # Only use this when upload port is not correctly detected due to multiple COM ports attached.
